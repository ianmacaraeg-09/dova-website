<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charis — DOVA Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <img src="../assets/dova-wordmark.png" alt="DOVA">
  <div class="admin-header-right">
    <span class="admin-user-email" id="userEmail"></span>
    <button class="admin-signout" id="signOutBtn">Sign out</button>
    <a class="back" href="dashboard.html">&larr; All agents</a>
  </div>
</header>

<main>
  <div class="agent-page-header">
    <h1 class="agent-page-name">Charis</h1>
    <span class="agent-page-role">Follow-up &amp; Reviews</span>
    <p class="agent-page-note">Brings customers back and asks for the review at the moment they're most likely to leave one. No backend built yet, so the chat below is a placeholder; the leads themselves are real sandbox data.</p>
  </div>

  <div class="data-section">
    <div class="data-section-head">
      <h2>Leads</h2>
      <span class="count" id="rowsCount"></span>
    </div>
    <div class="data-table-wrap" id="rowsTable"></div>
  </div>
</main>

<script src="supabase-auth.js"></script>
<script src="auth-check.js"></script>
<script src="render-table.js"></script>
<script>
  document.getElementById('userEmail').textContent = getUserEmail() || '';
  document.getElementById('signOutBtn').addEventListener('click', function () {
    signOut().then(function () { location.href = 'login.html'; });
  });

  fetchTable('leads', 'select=*&order=created_at.desc').then(function (rows) {
    document.getElementById('rowsCount').textContent = rows.length + ' total';
    renderTable('rowsTable', rows, [
      { label: 'Name', key: 'name' },
      { label: 'Source', render: function (r) { return pill(r.source); } },
      { label: 'Last contacted', render: function (r) { return fmtDate(r.last_contacted_at); } },
      { label: 'Stage', render: function (r) {
        var tone = r.stage === 'won' ? 'ok' : (r.stage === 'lost' ? 'danger' : 'warn');
        return pill(r.stage, tone);
      } }
    ]);
  }).catch(function (err) {
    document.getElementById('rowsTable').innerHTML = '<div class="data-empty">' + escapeHtml(err.message) + '</div>';
  });
</script>
<script src="widget.js"></script>
<script>
  initAgentWidget({ agentName: 'Charis', endpoint: '', enabled: false });
</script>
</body>
</html>
