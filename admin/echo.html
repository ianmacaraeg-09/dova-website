<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo — DOVA Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <img src="../assets/dova-wordmark.png" alt="DOVA">
  <div class="admin-header-right">
    <span class="admin-user-email" id="userEmail"></span>
    <button class="admin-signout" id="signOutBtn">Sign out</button>
    <a class="back" href="dashboard.html">&larr; All agents</a>
  </div>
</header>

<main>
  <div class="agent-page-header">
    <h1 class="agent-page-name">Echo</h1>
    <span class="agent-page-role">24/7 Helpdesk</span>
    <p class="agent-page-note">Answers every enquiry that lands &mdash; web, Messenger, SMS &mdash; in your voice and your prices. Same assistant as the public Contact page widget; ask it anything from here too.</p>
  </div>

  <div class="data-section">
    <div class="data-section-head">
      <h2>Enquiries</h2>
      <span class="count" id="rowsCount"></span>
    </div>
    <div class="data-table-wrap" id="rowsTable"></div>
  </div>
</main>

<script src="supabase-auth.js"></script>
<script src="auth-check.js"></script>
<script src="render-table.js"></script>
<script>
  document.getElementById('userEmail').textContent = getUserEmail() || '';
  document.getElementById('signOutBtn').addEventListener('click', function () {
    signOut().then(function () { location.href = 'login.html'; });
  });

  fetchTable('enquiries', 'select=*&order=created_at.desc').then(function (rows) {
    document.getElementById('rowsCount').textContent = rows.length + ' total';
    renderTable('rowsTable', rows, [
      { label: 'From', key: 'customer_name' },
      { label: 'Email', render: function (r) { return r.email || '&mdash;'; } },
      { label: 'Channel', render: function (r) { return pill(r.channel); } },
      { label: 'Message', key: 'message' },
      { label: 'Status', render: function (r) {
        var tone = r.status === 'escalated' ? 'danger' : (r.status === 'answered' ? 'ok' : 'warn');
        return pill(r.status, tone);
      } },
      { label: 'Received', render: function (r) { return fmtDateTime(r.created_at); } }
    ]);
  }).catch(function (err) {
    document.getElementById('rowsTable').innerHTML = '<div class="data-empty">' + escapeHtml(err.message) + '</div>';
  });
</script>
<script src="widget.js"></script>
<script>
  initAgentWidget({
    agentName: 'Echo',
    endpoint: 'http://127.0.0.1:8788/chat',
    enabled: true,
    avatar: 'blob',
    blobPalette: ['#d81b60', '#e8487a', '#f06e6a', '#f5a077', '#f8c9a0'],
    tts: true
  });
</script>
</body>
</html>
