<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hora — DOVA Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <img src="../assets/dova-wordmark.png" alt="DOVA">
  <div class="admin-header-right">
    <span class="admin-user-email" id="userEmail"></span>
    <button class="admin-signout" id="signOutBtn">Sign out</button>
    <a class="back" href="dashboard.html">&larr; All agents</a>
  </div>
</header>

<main>
  <div class="agent-page-header">
    <h1 class="agent-page-name">Hora</h1>
    <span class="agent-page-role">Bookings &amp; Scheduling</span>
    <p class="agent-page-note">Holds the calendar, confirms and reschedules, chases deposits. No backend built yet, so the chat below is a placeholder; the bookings themselves are real sandbox data.</p>
  </div>

  <div class="data-section">
    <div class="data-section-head">
      <h2>Bookings</h2>
      <span class="count" id="rowsCount"></span>
    </div>
    <div class="data-table-wrap" id="rowsTable"></div>
  </div>
</main>

<script src="supabase-auth.js"></script>
<script src="auth-check.js"></script>
<script src="render-table.js"></script>
<script>
  document.getElementById('userEmail').textContent = getUserEmail() || '';
  document.getElementById('signOutBtn').addEventListener('click', function () {
    signOut().then(function () { location.href = 'login.html'; });
  });

  fetchTable('bookings', 'select=*&order=start_time.asc').then(function (rows) {
    document.getElementById('rowsCount').textContent = rows.length + ' total';
    renderTable('rowsTable', rows, [
      { label: 'Customer', key: 'customer_name' },
      { label: 'Service', key: 'service' },
      { label: 'Resource', render: function (r) { return r.resource || '&mdash;'; } },
      { label: 'When', render: function (r) { return fmtDateTime(r.start_time); } },
      { label: 'Deposit', render: function (r) { return r.deposit_paid ? pill('Paid', 'ok') : pill('Unpaid', 'warn'); } },
      { label: 'Status', render: function (r) {
        var tone = r.status === 'confirmed' ? 'ok' : (r.status === 'no_show' ? 'danger' : 'warn');
        return pill(r.status, tone);
      } }
    ]);
  }).catch(function (err) {
    document.getElementById('rowsTable').innerHTML = '<div class="data-empty">' + escapeHtml(err.message) + '</div>';
  });
</script>
<script src="widget.js"></script>
<script>
  initAgentWidget({ agentName: 'Hora', endpoint: '', enabled: false });
</script>
</body>
</html>
